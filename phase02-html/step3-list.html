<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>修理の基礎</title>
</head>
<body>
  <main>
    <h1>修理の基礎</h1>

    <section>
      <h2>必要な工具</h2>
      <ul>
        <li>ドライバー</li>
        <li>ピンセット</li>
        <li>ヘラ</li>
      </ul>
    </section>

    <section>
      <h2>バッテリー交換の手順（例）</h2>
      <ol>
        <li><strong>必ず電源を切ってください</strong></li>
        <li>ネジを外す</li>
        <li>画面を開ける</li>
        <li>バッテリーを交換する</li>
      </ol>
    </section>

    <section>
      <h2>用語集</h2>
      <dl>
        <dt>回路（かいろ）</dt>
        <dd lang="en">Circuit</dd>
        <dd lang="my">လျှပ်စစ်ပတ်လမ်း</dd>

        <dt>電圧(でんあつ)</dt>
        <dd lang="eng">Voltage</dd>
        <dd lang="my">ဗို့အား</dd>

        <dt>抵抗（ていこう）</dt>
        <dd lang="eng">Resistance</dd>
        <dd lang="my">လျှပ်ခုခံမှု</dd>
      </dl>
    </section>
  </main>
</body>
</html>
