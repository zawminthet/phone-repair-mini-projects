<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修理履歴</title>
</head>

<body>
    <main>
        <h1>修理履歴</h1>

        <table>
            <caption>修理履歴（サンプルデータ）</caption>
            <thead>
                <tr>
                    <th scope="col">案件番号</th>
                    <th scope="col">機種</th>
                    <th scope="col">症状</th>
                    <th scope="col">修理内容</th>
                    <th scope="col">費用</th>
                    <th scope="col">結果</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>#001</td>
                    <td>iPhone 15</td>
                    <td>充電できない</td>
                    <td>充電ポート交換</td>
                    <td>¥12,000</td>
                    <td>合格</td>
                </tr>
                <tr>
                    <td>#002</td>
                    <td>Galaxy S24</td>
                    <td>画面が割れた</td>
                    <td>ディスプレイ交換</td>
                    <td>¥30,000</td>
                    <td>合格</td>
                </tr>
            </tbody>
        </table>
    </main>
</body>

</html>
